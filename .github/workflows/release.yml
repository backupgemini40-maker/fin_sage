name: FinSage Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis before release
        run: flutter analyze --no-fatal-infos

      - name: Run tests before release
        run: flutter test

  android_build:
    runs-on: ubuntu-latest
    needs: tests
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      ANDROID_APP_ORG: ${{ vars.ANDROID_APP_ORG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android platform
        run: |
          android_org="${ANDROID_APP_ORG:-com.financeapp}"
          echo "Using Android org: $android_org"

          rm -rf /tmp/finsage_app_backup
          mkdir -p /tmp/finsage_app_backup
          cp -R lib /tmp/finsage_app_backup/lib
          cp -R assets /tmp/finsage_app_backup/assets
          cp -R test /tmp/finsage_app_backup/test
          cp -R integration_test /tmp/finsage_app_backup/integration_test
          cp pubspec.yaml /tmp/finsage_app_backup/pubspec.yaml
          cp l10n.yaml /tmp/finsage_app_backup/l10n.yaml

          flutter create . --platforms=android --project-name fin_sage --org "$android_org" --overwrite

          rm -rf lib assets test integration_test
          cp -R /tmp/finsage_app_backup/lib ./lib
          cp -R /tmp/finsage_app_backup/assets ./assets
          cp -R /tmp/finsage_app_backup/test ./test
          cp -R /tmp/finsage_app_backup/integration_test ./integration_test
          cp /tmp/finsage_app_backup/pubspec.yaml ./pubspec.yaml
          cp /tmp/finsage_app_backup/l10n.yaml ./l10n.yaml

          cat <<'EOT' > android/key.properties
          storePassword=***
          keyPassword=***
          keyAlias=***
          storeFile=fin_sage.keystore
          EOT

          cat <<'EOT' > android/app/key.properties
          storePassword=***
          keyPassword=***
          keyAlias=***
          storeFile=fin_sage.keystore
          EOT

          echo "REPLACE_WITH_REAL_KEYSTORE" > android/app.keystore.placeholder

          android_app_id=""
          if [ -f android/app/build.gradle.kts ]; then
            android_app_id="$(sed -n 's/^[[:space:]]*applicationId = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -n1)"
          fi
          if [ -z "$android_app_id" ] && [ -f android/app/build.gradle ]; then
            android_app_id="$(sed -n "s/^[[:space:]]*applicationId[[:space:]]*['\"]\\(.*\\)['\"]/\\1/p" android/app/build.gradle | head -n1)"
          fi
          if [ -z "$android_app_id" ] && [ -f android/app/build.gradle ]; then
            android_app_id="$(sed -n 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' android/app/build.gradle | head -n1)"
          fi
          if [ -z "$android_app_id" ]; then
            android_app_id="${android_org}.fin_sage"
            echo "ApplicationId parsing fallback applied: $android_app_id"
          fi
          echo "ANDROID_APP_ID=$android_app_id" >> "$GITHUB_ENV"
          echo "Detected Android applicationId: $android_app_id"

      - name: Resolve release metadata
        id: meta
        run: |
          release_version="$(sed -n 's/^version: \([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' pubspec.yaml | head -n1)"
          app_version="$(sed -n 's/^version: \([^[:space:]]\+\).*/\1/p' pubspec.yaml | head -n1)"
          if [ -z "$release_version" ] || [ -z "$app_version" ]; then
            echo "Cannot parse semantic version from pubspec.yaml"
            exit 1
          fi
          echo "release_version=$release_version" >> "$GITHUB_ENV"
          echo "app_version=$app_version" >> "$GITHUB_ENV"

      - name: Patch Android build toolchain versions
        run: |
          target_kotlin_version="2.2.0"
          target_agp_version="8.12.1"
          target_gradle_version="8.13"

          if [ -f android/settings.gradle ]; then
            sed -i -E \
              "s/id \"org.jetbrains.kotlin.android\" version \"[^\"]+\"/id \"org.jetbrains.kotlin.android\" version \"$target_kotlin_version\"/g" \
              android/settings.gradle
            sed -i -E \
              "s/id 'org.jetbrains.kotlin.android' version '[^']+'/id 'org.jetbrains.kotlin.android' version '$target_kotlin_version'/g" \
              android/settings.gradle
            sed -i -E \
              "s/id \"com.android.application\" version \"[^\"]+\"/id \"com.android.application\" version \"$target_agp_version\"/g" \
              android/settings.gradle
            sed -i -E \
              "s/id \"com.android.library\" version \"[^\"]+\"/id \"com.android.library\" version \"$target_agp_version\"/g" \
              android/settings.gradle
            sed -i -E \
              "s/id 'com.android.application' version '[^']+'/id 'com.android.application' version '$target_agp_version'/g" \
              android/settings.gradle
            sed -i -E \
              "s/id 'com.android.library' version '[^']+'/id 'com.android.library' version '$target_agp_version'/g" \
              android/settings.gradle
          fi

          if [ -f android/settings.gradle.kts ]; then
            sed -i -E \
              "s/id\\(\"org.jetbrains.kotlin.android\"\\) version \"[^\"]+\"/id(\"org.jetbrains.kotlin.android\") version \"$target_kotlin_version\"/g" \
              android/settings.gradle.kts
            sed -i -E \
              "s/id\\(\"com.android.application\"\\) version \"[^\"]+\"/id(\"com.android.application\") version \"$target_agp_version\"/g" \
              android/settings.gradle.kts
            sed -i -E \
              "s/id\\(\"com.android.library\"\\) version \"[^\"]+\"/id(\"com.android.library\") version \"$target_agp_version\"/g" \
              android/settings.gradle.kts
          fi

          if [ -f android/build.gradle ]; then
            sed -i -E \
              "s/ext\.kotlin_version = '([^']+)'/ext.kotlin_version = '$target_kotlin_version'/g" \
              android/build.gradle
            sed -i -E \
              "s/org.jetbrains.kotlin:kotlin-gradle-plugin:[^\"]+/org.jetbrains.kotlin:kotlin-gradle-plugin:$target_kotlin_version/g" \
              android/build.gradle
            sed -i -E \
              "s/com.android.tools.build:gradle:[^\"]+/com.android.tools.build:gradle:$target_agp_version/g" \
              android/build.gradle
          fi

          if [ -f android/build.gradle.kts ]; then
            sed -i -E \
              "s/id\\(\"org.jetbrains.kotlin.android\"\\) version \"[^\"]+\"/id(\"org.jetbrains.kotlin.android\") version \"$target_kotlin_version\"/g" \
              android/build.gradle.kts
            sed -i -E \
              "s/id\\(\"com.android.application\"\\) version \"[^\"]+\"/id(\"com.android.application\") version \"$target_agp_version\"/g" \
              android/build.gradle.kts
            sed -i -E \
              "s/id\\(\"com.android.library\"\\) version \"[^\"]+\"/id(\"com.android.library\") version \"$target_agp_version\"/g" \
              android/build.gradle.kts
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E \
              "s#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-${target_gradle_version}-bin.zip#g" \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          if ! grep -R -n \
            -e "org.jetbrains.kotlin.android\" version \"$target_kotlin_version\"" \
            -e "org.jetbrains.kotlin.android' version '$target_kotlin_version'" \
            -e "id(\"org.jetbrains.kotlin.android\") version \"$target_kotlin_version\"" \
            -e "ext.kotlin_version = '$target_kotlin_version'" \
            -e "kotlin-gradle-plugin:$target_kotlin_version" \
            android 2>/dev/null; then
            echo "Warning: Kotlin patch marker not found. Continue with current generated config."
          fi

          if ! grep -R -n \
            -e "com.android.application\" version \"$target_agp_version\"" \
            -e "com.android.application' version '$target_agp_version'" \
            -e "id(\"com.android.application\") version \"$target_agp_version\"" \
            -e "com.android.library\" version \"$target_agp_version\"" \
            -e "com.android.library' version '$target_agp_version'" \
            -e "id(\"com.android.library\") version \"$target_agp_version\"" \
            -e "com.android.tools.build:gradle:$target_agp_version" \
            android 2>/dev/null; then
            echo "Warning: AGP patch marker not found. Continue with current generated config."
          fi

          if ! grep -n "gradle-${target_gradle_version}-bin.zip" android/gradle/wrapper/gradle-wrapper.properties >/dev/null 2>&1; then
            echo "Warning: Gradle wrapper patch marker not found. Continue with current generated config."
          fi

      - name: Release preflight checks
        run: |
          test -f pubspec.yaml
          test -f .metadata
          test -f lib/main.dart
          grep -q "class FinSageApp" lib/main.dart
          test -f android/app.keystore.placeholder
          grep -q "REPLACE_WITH_REAL_KEYSTORE" android/app.keystore.placeholder
          grep -q '^storePassword=\*\*\*$' android/key.properties
          grep -q '^keyPassword=\*\*\*$' android/key.properties
          grep -q '^keyAlias=\*\*\*$' android/key.properties
          grep -q '^storePassword=\*\*\*$' android/app/key.properties
          grep -q '^keyPassword=\*\*\*$' android/app/key.properties
          grep -q '^keyAlias=\*\*\*$' android/app/key.properties
          tracked_keystore_files="$(git ls-files 'android/app/*.keystore')"
          if [ -n "$tracked_keystore_files" ]; then
            echo "Tracked keystore file detected:"
            echo "$tracked_keystore_files"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tag_version="${BASH_REMATCH[1]}"
            pubspec_version="$(sed -n 's/^version: \([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' pubspec.yaml | head -n1)"
            if [ -z "$pubspec_version" ]; then
              echo "Cannot parse semantic version from pubspec.yaml"
              exit 1
            fi
            if [ "$tag_version" != "$pubspec_version" ]; then
              echo "Tag version ($tag_version) does not match pubspec version ($pubspec_version)."
              exit 1
            fi
          fi

          if [ -z "${ANDROID_APP_ID:-}" ]; then
            echo "ANDROID_APP_ID is empty."
            exit 1
          fi

      - name: Validate keystore secrets
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Missing release signing secrets. Set KEYSTORE_B64, KEYSTORE_PASS, KEY_ALIAS, KEY_PASS."
            exit 1
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "Missing Google auth secrets. Set GOOGLE_CLIENT_ID and GOOGLE_SERVER_CLIENT_ID."
            exit 1
          fi

      - name: Android package summary
        run: |
          echo "Android package for this release build: \`$ANDROID_APP_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Ensure Firebase/Google Cloud OAuth credentials use this exact package name." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare keystore
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/fin_sage.keystore
          cat <<EOT > android/key.properties
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=fin_sage.keystore
          EOT
          cat <<EOT > android/app/key.properties
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=fin_sage.keystore
          EOT

      - name: Configure Android release signing
        run: |
          if [ -f android/app/build.gradle ]; then
            if ! grep -q "finsageReleaseSigningConfig" android/app/build.gradle; then
              {
                printf '\n%s\n' 'def keystoreProperties = new Properties()'
                printf '%s\n' 'def keystorePropertiesFile = rootProject.file("key.properties")'
                printf '%s\n' 'if (keystorePropertiesFile.exists()) {'
                printf '%s\n' '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))'
                printf '%s\n' '}'
                printf '\n%s\n' 'android {'
                printf '%s\n' '    signingConfigs {'
                printf '%s\n' '        release {'
                printf '%s\n' '            keyAlias keystoreProperties["keyAlias"]'
                printf '%s\n' '            keyPassword keystoreProperties["keyPassword"]'
                printf '%s\n' '            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null'
                printf '%s\n' '            storePassword keystoreProperties["storePassword"]'
                printf '%s\n' '        }'
                printf '%s\n' '    }'
                printf '%s\n' '    buildTypes {'
                printf '%s\n' '        release {'
                printf '%s\n' '            signingConfig signingConfigs.release'
                printf '%s\n' '        }'
                printf '%s\n' '    }'
                printf '%s\n' '}'
                printf '%s\n' '// finsageReleaseSigningConfig'
              } >> android/app/build.gradle
            fi

            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' android/app/build.gradle
            sed -i 's/signingConfig = signingConfigs.debug/signingConfig = signingConfigs.release/g' android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            if ! grep -q "finsageReleaseSigningConfig" android/app/build.gradle.kts; then
              {
                printf '\n%s\n' 'import java.io.FileInputStream'
                printf '%s\n' 'import java.util.Properties'
                printf '\n%s\n' 'val keystoreProperties = Properties()'
                printf '%s\n' 'val keystorePropertiesFile = rootProject.file("key.properties")'
                printf '%s\n' 'if (keystorePropertiesFile.exists()) {'
                printf '%s\n' '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))'
                printf '%s\n' '}'
                printf '\n%s\n' 'android {'
                printf '%s\n' '    signingConfigs {'
                printf '%s\n' '        create("release") {'
                printf '%s\n' '            keyAlias = keystoreProperties["keyAlias"] as String?'
                printf '%s\n' '            keyPassword = keystoreProperties["keyPassword"] as String?'
                printf '%s\n' '            storeFile = (keystoreProperties["storeFile"] as String?)?.let { file(it) }'
                printf '%s\n' '            storePassword = keystoreProperties["storePassword"] as String?'
                printf '%s\n' '        }'
                printf '%s\n' '    }'
                printf '%s\n' '    buildTypes {'
                printf '%s\n' '        getByName("release") {'
                printf '%s\n' '            signingConfig = signingConfigs.getByName("release")'
                printf '%s\n' '        }'
                printf '%s\n' '    }'
                printf '%s\n' '}'
                printf '%s\n' '// finsageReleaseSigningConfig'
              } >> android/app/build.gradle.kts
            fi

            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/g' android/app/build.gradle.kts
            sed -i 's/signingConfig = signingConfigs.debug/signingConfig = signingConfigs.getByName("release")/g' android/app/build.gradle.kts
          fi

      - name: Print signing certificate fingerprints
        run: |
          keytool -list -v \
            -keystore android/app/fin_sage.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" > /tmp/release_keystore_info.txt
          sha1="$(sed -n 's/.*SHA1: //p' /tmp/release_keystore_info.txt | head -n1)"
          sha256="$(sed -n 's/.*SHA256: //p' /tmp/release_keystore_info.txt | head -n1)"
          if [ -z "$sha1" ] || [ -z "$sha256" ]; then
            echo "Unable to extract SHA fingerprint from keystore."
            exit 1
          fi
          echo "Release keystore SHA-1: \`$sha1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Release keystore SHA-256: \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p build/ci
          {
            echo "ANDROID_APPLICATION_ID=$ANDROID_APP_ID"
            echo "RELEASE_KEYSTORE_SHA1=$sha1"
            echo "RELEASE_KEYSTORE_SHA256=$sha256"
          } > build/ci/google_signin_release_metadata.txt

      - name: Upload Google Sign-In metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: google-signin-release-metadata
          path: build/ci/google_signin_release_metadata.txt

      - name: Patch Android plugin Gradle SDK placeholders
        run: |
          mapfile -t gradle_files < <(
            grep -RIl \
              --include="build.gradle" \
              --include="build.gradle.kts" \
              --exclude-dir="example" \
              -e "flutter.compileSdkVersion" \
              -e "flutter.minSdkVersion" \
              -e "flutter.targetSdkVersion" \
              "$HOME/.pub-cache/hosted/pub.dev"
          )

          if [ "${#gradle_files[@]}" -eq 0 ]; then
            echo "No plugin build.gradle files with flutter SDK placeholders found."
            exit 0
          fi

          for plugin_gradle in "${gradle_files[@]}"; do
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' "$plugin_gradle"
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/g' "$plugin_gradle"
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' "$plugin_gradle"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$plugin_gradle"
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/g' "$plugin_gradle"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$plugin_gradle"
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' "$plugin_gradle"
            sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 34/g' "$plugin_gradle"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' "$plugin_gradle"

            if grep -q \
              -e "flutter.compileSdkVersion" \
              -e "flutter.minSdkVersion" \
              -e "flutter.targetSdkVersion" \
              "$plugin_gradle"; then
              echo "Patch did not apply fully: $plugin_gradle"
              exit 1
            fi

            echo "Patched: $plugin_gradle"
          done

      - name: Patch Kotlin language version in plugins
        run: |
          mapfile -t kotlin_gradle_files < <(
            grep -RIl \
              --include="build.gradle" \
              --include="build.gradle.kts" \
              -e 'languageVersion = "1.6"' \
              -e "languageVersion = '1.6'" \
              -e 'apiVersion = "1.6"' \
              -e "apiVersion = '1.6'" \
              -e '-language-version 1.6' \
              -e '-api-version 1.6' \
              "$HOME/.pub-cache/hosted/pub.dev"
          )

          if [ "${#kotlin_gradle_files[@]}" -eq 0 ]; then
            echo "No plugin Kotlin 1.6 language settings found."
            exit 0
          fi

          for kotlin_file in "${kotlin_gradle_files[@]}"; do
            sed -i 's/languageVersion = "1.6"/languageVersion = "1.8"/g' "$kotlin_file"
            sed -i "s/languageVersion = '1.6'/languageVersion = '1.8'/g" "$kotlin_file"
            sed -i 's/apiVersion = "1.6"/apiVersion = "1.8"/g' "$kotlin_file"
            sed -i "s/apiVersion = '1.6'/apiVersion = '1.8'/g" "$kotlin_file"
            sed -i 's/-language-version 1.6/-language-version 1.8/g' "$kotlin_file"
            sed -i 's/-api-version 1.6/-api-version 1.8/g' "$kotlin_file"
            echo "Patched Kotlin language level: $kotlin_file"
          done

      - name: Patch Android app Gradle compatibility
        run: |
          target_ndk="27.0.12077973"
          target_desugar="com.android.tools:desugar_jdk_libs:2.1.5"

          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/ndkVersion[[:space:]]*=[[:space:]]*flutter\.ndkVersion/ndkVersion = "'"$target_ndk"'"/g' android/app/build.gradle
            sed -i -E 's/ndkVersion[[:space:]]+flutter\.ndkVersion/ndkVersion "'"$target_ndk"'"/g' android/app/build.gradle
            sed -i -E 's/ndkVersion[[:space:]]*=[[:space:]]*"[^"]+"/ndkVersion = "'"$target_ndk"'"/g' android/app/build.gradle

            if ! grep -q "ndkVersion" android/app/build.gradle; then
              sed -i '/android[[:space:]]*{/a\    ndkVersion "'"$target_ndk"'"' android/app/build.gradle
            fi

            if grep -q "compileOptions[[:space:]]*{" android/app/build.gradle; then
              if ! grep -q "coreLibraryDesugaringEnabled" android/app/build.gradle; then
                sed -i '/compileOptions[[:space:]]*{/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
              fi
            fi

            if ! grep -q "coreLibraryDesugaring[[:space:]]*['\"]$target_desugar['\"]" android/app/build.gradle; then
              sed -i '/dependencies[[:space:]]*{/a\    coreLibraryDesugaring "'"$target_desugar"'"' android/app/build.gradle
            fi

            if ! grep -q "coreLibraryDesugaring[[:space:]]*['\"]$target_desugar['\"]" android/app/build.gradle; then
              {
                echo ""
                echo "android {"
                echo "    ndkVersion \"$target_ndk\""
                echo "    compileOptions {"
                echo "        coreLibraryDesugaringEnabled true"
                echo "    }"
                echo "}"
                echo ""
                echo "dependencies {"
                echo "    coreLibraryDesugaring \"$target_desugar\""
                echo "}"
              } >> android/app/build.gradle
            fi
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/ndkVersion[[:space:]]*=[[:space:]]*flutter\.ndkVersion/ndkVersion = "'"$target_ndk"'"/g' android/app/build.gradle.kts
            sed -i -E 's/ndkVersion[[:space:]]*=[[:space:]]*"[^"]+"/ndkVersion = "'"$target_ndk"'"/g' android/app/build.gradle.kts

            if ! grep -q "ndkVersion" android/app/build.gradle.kts; then
              sed -i '/android[[:space:]]*{/a\    ndkVersion = "'"$target_ndk"'"' android/app/build.gradle.kts
            fi

            if grep -q "compileOptions[[:space:]]*{" android/app/build.gradle.kts; then
              if ! grep -q "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts; then
                sed -i '/compileOptions[[:space:]]*{/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
              fi
            fi

            if ! grep -q "coreLibraryDesugaring(\"$target_desugar\")" android/app/build.gradle.kts; then
              sed -i '/dependencies[[:space:]]*{/a\    coreLibraryDesugaring("'"$target_desugar"'")' android/app/build.gradle.kts
            fi

            if ! grep -q "coreLibraryDesugaring(\"$target_desugar\")" android/app/build.gradle.kts; then
              {
                echo ""
                echo "android {"
                echo "    ndkVersion = \"$target_ndk\""
                echo "    compileOptions {"
                echo "        isCoreLibraryDesugaringEnabled = true"
                echo "    }"
                echo "}"
                echo ""
                echo "dependencies {"
                echo "    coreLibraryDesugaring(\"$target_desugar\")"
                echo "}"
              } >> android/app/build.gradle.kts
            fi
          fi

      - name: Debug app Gradle config
        run: |
          echo "----- android/app/build.gradle -----"
          if [ -f android/app/build.gradle ]; then
            sed -n '1,260p' android/app/build.gradle
          else
            echo "android/app/build.gradle not found"
          fi
          echo "----- android/app/build.gradle.kts -----"
          if [ -f android/app/build.gradle.kts ]; then
            sed -n '1,260p' android/app/build.gradle.kts
          else
            echo "android/app/build.gradle.kts not found"
          fi

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=APP_VERSION="$app_version" \
            --dart-define=ANDROID_APPLICATION_ID="$ANDROID_APP_ID" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Assert APK is not debug-signed
        run: |
          cert_dump="$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk)"
          echo "$cert_dump" | sed -n '1,40p'
          if echo "$cert_dump" | grep -q "CN=Android Debug"; then
            echo "APK is still signed with Android Debug certificate. Release signing is not applied."
            exit 1
          fi

      - name: Verify signed APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify -verbose -certs build/app/outputs/flutter-apk/app-release.apk

      - name: Generate APK checksum
        run: |
          apk_hash="$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d ' ' -f1)"
          echo "$apk_hash  app-release.apk" > build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: finsage-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/app/fin_sage.keystore
          rm -f android/key.properties
          rm -f android/app/key.properties

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android_build]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: finsage-release-apk
          path: artifacts/finsage-release-apk

      - name: Prepare release notes
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^version: \([^[:space:]]\+\).*/\1/p' pubspec.yaml | head -n1)"
          checksum_file="artifacts/finsage-release-apk/app-release.apk.sha256"
          checksum_value="$(cut -d ' ' -f1 "$checksum_file")"
          cat <<EOF > /tmp/release_body.md
          FinSage release v${release_version}
          App version: \`${app_version}\`

          APK file: \`app-release.apk\`
          SHA256: \`$checksum_value\`
          EOF

      - name: Verify downloaded release artifact checksum
        run: |
          checksum_file="artifacts/finsage-release-apk/app-release.apk.sha256"
          apk_file="artifacts/finsage-release-apk/app-release.apk"
          expected_hash="$(cut -d ' ' -f1 "$checksum_file")"
          actual_hash="$(sha256sum "$apk_file" | cut -d ' ' -f1)"
          if [ "$expected_hash" != "$actual_hash" ]; then
            echo "Release artifact checksum mismatch."
            echo "expected=$expected_hash"
            echo "actual=$actual_hash"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/finsage-release-apk/app-release.apk
            artifacts/finsage-release-apk/app-release.apk.sha256
          body_path: /tmp/release_body.md
          generate_release_notes: true
