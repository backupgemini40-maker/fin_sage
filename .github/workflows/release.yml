name: FinSage Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis before release
        run: flutter analyze --no-fatal-infos

      - name: Run tests before release
        run: flutter test

  android_build:
    runs-on: ubuntu-latest
    needs: tests
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android platform
        run: |
          flutter create . --platforms=android --project-name fin_sage --org com.financeapp

          cat <<'EOT' > android/key.properties
          storePassword=***
          keyPassword=***
          keyAlias=***
          storeFile=fin_sage.keystore
          EOT

          cat <<'EOT' > android/app/key.properties
          storePassword=***
          keyPassword=***
          keyAlias=***
          storeFile=fin_sage.keystore
          EOT

          echo "REPLACE_WITH_REAL_KEYSTORE" > android/app.keystore.placeholder

      - name: Resolve release metadata
        id: meta
        run: |
          release_version="$(sed -n 's/^version: \([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' pubspec.yaml | head -n1)"
          app_version="$(sed -n 's/^version: \([^[:space:]]\+\).*/\1/p' pubspec.yaml | head -n1)"
          if [ -z "$release_version" ] || [ -z "$app_version" ]; then
            echo "Cannot parse semantic version from pubspec.yaml"
            exit 1
          fi
          echo "release_version=$release_version" >> "$GITHUB_ENV"
          echo "app_version=$app_version" >> "$GITHUB_ENV"

      - name: Release preflight checks
        run: |
          test -f pubspec.yaml
          test -f .metadata
          test -f lib/main.dart
          grep -q "class FinSageApp" lib/main.dart
          test -f android/app.keystore.placeholder
          grep -q "REPLACE_WITH_REAL_KEYSTORE" android/app.keystore.placeholder
          grep -q '^storePassword=\*\*\*$' android/key.properties
          grep -q '^keyPassword=\*\*\*$' android/key.properties
          grep -q '^keyAlias=\*\*\*$' android/key.properties
          grep -q '^storePassword=\*\*\*$' android/app/key.properties
          grep -q '^keyPassword=\*\*\*$' android/app/key.properties
          grep -q '^keyAlias=\*\*\*$' android/app/key.properties
          tracked_keystore_files="$(git ls-files 'android/app/*.keystore')"
          if [ -n "$tracked_keystore_files" ]; then
            echo "Tracked keystore file detected:"
            echo "$tracked_keystore_files"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tag_version="${BASH_REMATCH[1]}"
            pubspec_version="$(sed -n 's/^version: \([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' pubspec.yaml | head -n1)"
            if [ -z "$pubspec_version" ]; then
              echo "Cannot parse semantic version from pubspec.yaml"
              exit 1
            fi
            if [ "$tag_version" != "$pubspec_version" ]; then
              echo "Tag version ($tag_version) does not match pubspec version ($pubspec_version)."
              exit 1
            fi
          fi

      - name: Validate keystore secrets
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Missing release signing secrets. Set KEYSTORE_B64, KEYSTORE_PASS, KEY_ALIAS, KEY_PASS."
            exit 1
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "Missing Google auth secrets. Set GOOGLE_CLIENT_ID and GOOGLE_SERVER_CLIENT_ID."
            exit 1
          fi

      - name: Prepare keystore
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/fin_sage.keystore
          cat <<EOT > android/key.properties
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=fin_sage.keystore
          EOT
          cat <<EOT > android/app/key.properties
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=fin_sage.keystore
          EOT

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=APP_VERSION="$app_version" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Verify signed APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify -verbose -certs build/app/outputs/flutter-apk/app-release.apk

      - name: Generate APK checksum
        run: |
          apk_hash="$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d ' ' -f1)"
          echo "$apk_hash  app-release.apk" > build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: finsage-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/app/fin_sage.keystore
          rm -f android/key.properties
          rm -f android/app/key.properties

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android_build]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: finsage-release-apk
          path: artifacts/finsage-release-apk

      - name: Prepare release notes
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^version: \([^[:space:]]\+\).*/\1/p' pubspec.yaml | head -n1)"
          checksum_file="artifacts/finsage-release-apk/app-release.apk.sha256"
          checksum_value="$(cut -d ' ' -f1 "$checksum_file")"
          cat <<EOF > /tmp/release_body.md
          FinSage release v${release_version}
          App version: \`${app_version}\`

          APK file: \`app-release.apk\`
          SHA256: \`$checksum_value\`
          EOF

      - name: Verify downloaded release artifact checksum
        run: |
          checksum_file="artifacts/finsage-release-apk/app-release.apk.sha256"
          apk_file="artifacts/finsage-release-apk/app-release.apk"
          expected_hash="$(cut -d ' ' -f1 "$checksum_file")"
          actual_hash="$(sha256sum "$apk_file" | cut -d ' ' -f1)"
          if [ "$expected_hash" != "$actual_hash" ]; then
            echo "Release artifact checksum mismatch."
            echo "expected=$expected_hash"
            echo "actual=$actual_hash"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/finsage-release-apk/app-release.apk
            artifacts/finsage-release-apk/app-release.apk.sha256
          body_path: /tmp/release_body.md
          generate_release_notes: true
